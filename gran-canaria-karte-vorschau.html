<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gran Canaria Rundreise – Karte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,Arial,sans-serif}
  #map{height:100%}
  .legend{background:#fff;padding:10px 12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);line-height:1.6;font-size:13px}
  .legend b{display:block;margin-bottom:4px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.35)}
  .leaflet-popup-content{font-size:13px;line-height:1.45}
  .leaflet-popup-content .cat{display:inline-block;font-size:11px;color:#fff;padding:1px 7px;border-radius:10px;margin:3px 0}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const CATEGORIES = {"sueden": {"label": "Etappe 1 · Süden", "tag": "Tag 1–2", "color": "#E53935", "kml_icon": "https://maps.google.com/mapfiles/kml/pushpin/red-pushpin.png"}, "fataga": {"label": "Etappe 2 · Fataga-Tal", "tag": "Tag 3", "color": "#FB8C00", "kml_icon": "https://maps.google.com/mapfiles/kml/pushpin/ylw-pushpin.png"}, "berge": {"label": "Etappe 3 · Bergland", "tag": "Tag 4", "color": "#43A047", "kml_icon": "https://maps.google.com/mapfiles/kml/pushpin/grn-pushpin.png"}, "westen": {"label": "Etappe 4 · Westküste (GC-200)", "tag": "Tag 5", "color": "#1E88E5", "kml_icon": "https://maps.google.com/mapfiles/kml/pushpin/blue-pushpin.png"}, "norden": {"label": "Etappe 5 · Norden", "tag": "Tag 6", "color": "#8E24AA", "kml_icon": "https://maps.google.com/mapfiles/kml/pushpin/purple-pushpin.png"}, "laspalmas": {"label": "Etappe 6 · Las Palmas", "tag": "Tag 7", "color": "#D81B60", "kml_icon": "https://maps.google.com/mapfiles/kml/pushpin/pink-pushpin.png"}, "extras": {"label": "Optional · 8–10 Tage", "tag": "optional", "color": "#00897B", "kml_icon": "https://maps.google.com/mapfiles/kml/pushpin/ltblu-pushpin.png"}, "unterkunft": {"label": "Unterkünfte", "tag": "—", "color": "#5D4037", "kml_icon": "https://maps.google.com/mapfiles/kml/shapes/lodging.png"}, "kulinarik": {"label": "Kulinarik", "tag": "—", "color": "#C0A800", "kml_icon": "https://maps.google.com/mapfiles/kml/shapes/dining.png"}};
  const PLACES = [{"name": "Dünen von Maspalomas", "lat": 27.7392, "lng": -15.5847, "cat": "sueden", "desc": "Echte Wüste am Meer. Am schönsten früh morgens oder kurz vor Sonnenuntergang – lange Schatten, kaum Leute."}, {"name": "Faro de Maspalomas", "lat": 27.7314, "lng": -15.5997, "cat": "sueden", "desc": "Alter Leuchtturm am Südzipfel. Schöner Spot für den ersten Sonnenuntergang."}, {"name": "Playa del Inglés", "lat": 27.7516, "lng": -15.5716, "cat": "sueden", "desc": "Großer Strand zum entspannten Ankommen."}, {"name": "Puerto de Mogán", "lat": 27.8156, "lng": -15.7656, "cat": "sueden", "desc": "Hübscher Hafenort. Startpunkt für Bootstouren – mit Glück Delfine."}, {"name": "Puerto Rico", "lat": 27.7894, "lng": -15.7106, "cat": "sueden", "desc": "Ferienort mit Hafen, ebenfalls Ausgangspunkt für Bootstouren."}, {"name": "Mirador de la Degollada de las Yeguas", "lat": 27.8193, "lng": -15.5793, "cat": "fataga", "desc": "Aussichtspunkt über die Schlucht, der „Grand Canyon von Gran Canaria“. Erster großer Blick auf der Auffahrt."}, {"name": "Arteara (Palmenhain & Necrópolis)", "lat": 27.8347, "lng": -15.5856, "cat": "fataga", "desc": "Ausgedehnter Palmenhain im Barranco de Fataga, dazu eine alte Ureinwohner-Nekropole."}, {"name": "Fataga", "lat": 27.8506, "lng": -15.5836, "cat": "fataga", "desc": "Hübsches weißes Bergdorf im „Tal der tausend Palmen“. Gute erste Mittagspause."}, {"name": "Roque Nublo", "lat": 27.9686, "lng": -15.6153, "cat": "berge", "desc": "67 m hoher Felsmonolith auf ~1.800 m – Wahrzeichen der Insel. Bei klarer Sicht im Westen der Teide."}, {"name": "Zubringer/Parkplatz La Goleta (GC-600)", "lat": 27.9742, "lng": -15.611, "cat": "berge", "desc": "Klassischer Startpunkt der Roque-Nublo-Wanderung (30–45 Min). ACHTUNG Stand 2025/26: Parkplatz für Privat-Pkw gesperrt – Zugang nur mit Online-Reservierung (grancanariasenderos.com) und Zubringerbus ab Cruz de los Llanos / Tejeda."}, {"name": "Pico de las Nieves", "lat": 27.9617, "lng": -15.5703, "cat": "berge", "desc": "Mit ~1.949 m der höchste Aussichtspunkt der Insel."}, {"name": "Tejeda", "lat": 27.9956, "lng": -15.6147, "cat": "berge", "desc": "Weißes Bergdorf, eines der schönsten Spaniens. Hier den Bienmesabe probieren."}, {"name": "Parador Cruz de Tejeda", "lat": 28.0086, "lng": -15.6011, "cat": "berge", "desc": "Berghotel an der Cruz de Tejeda. Optionale Bergnacht mit Sonnenaufgang über dem Wolkenmeer."}, {"name": "Mirador del Balcón", "lat": 28.0194, "lng": -15.7853, "cat": "westen", "desc": "In den Fels gehauene Plattform hoch über dem Atlantik – Höhepunkt der GC-200 („Drachenstraße“). Bei gutem Wetter Blick zum Teide."}, {"name": "Agaete", "lat": 28.0989, "lng": -15.7006, "cat": "westen", "desc": "Tor zum grünen Agaete-Tal, in dem sogar Kaffee wächst (Café de Agaete)."}, {"name": "Puerto de las Nieves", "lat": 28.1033, "lng": -15.7089, "cat": "westen", "desc": "Fischerort mit frischem Fisch am Paseo de los Poetas. Fähre nach Teneriffa."}, {"name": "Piscinas naturales Las Salinas", "lat": 28.1063, "lng": -15.7106, "cat": "westen", "desc": "Mehrere durch Lava verbundene Meerwasser-Naturbecken, ~10 Min zu Fuß vom Puerto de las Nieves."}, {"name": "Gáldar – Cueva Pintada", "lat": 28.1456, "lng": -15.6536, "cat": "norden", "desc": "Unter einer Bananenplantage ausgegrabene Ureinwohner-Siedlung mit originalen Wandmalereien. Museum, montags oft geschlossen – vorab planen."}, {"name": "Arucas – Iglesia de San Juan Bautista", "lat": 28.119, "lng": -15.5237, "cat": "norden", "desc": "Mächtige Kirche aus dunklem Vulkanstein, im Volksmund „Kathedrale von Arucas“."}, {"name": "Destilería Arehucas", "lat": 28.1158, "lng": -15.5249, "cat": "norden", "desc": "Älteste Rumfabrik der Kanaren. Führung durch die Reifekeller, Verkostung von Rum und Ron Miel. Meist nur vormittags."}, {"name": "Teror", "lat": 28.0606, "lng": -15.5478, "cat": "norden", "desc": "Wallfahrtsort mit Holzbalkonen, Sonntagsmarkt und streichfähigem Chorizo de Teror."}, {"name": "Catedral de Santa Ana (Vegueta)", "lat": 28.0989, "lng": -15.4157, "cat": "laspalmas", "desc": "Kathedrale in der kolonialen Altstadt; vom Turm toller Blick über die Dächer."}, {"name": "Casa de Colón", "lat": 28.1003, "lng": -15.4154, "cat": "laspalmas", "desc": "Museum zu Christoph Kolumbus mitten in Vegueta."}, {"name": "Museo Canario", "lat": 28.0982, "lng": -15.4159, "cat": "laspalmas", "desc": "Mumien und Funde der Ureinwohner – ordnet Bergland und Gáldar erst richtig ein."}, {"name": "Playa de las Canteras", "lat": 28.1397, "lng": -15.4339, "cat": "laspalmas", "desc": "Einer der schönsten Stadtstrände Europas. Promenade zum Sonnenuntergang."}, {"name": "Mercado del Puerto", "lat": 28.1362, "lng": -15.4286, "cat": "laspalmas", "desc": "Markthalle mit Tapas – idealer Ausklang des Trips."}, {"name": "Lopesan Costa Meloneras", "lat": 27.7445, "lng": -15.6042, "cat": "unterkunft", "desc": "Empfehlung erste Hälfte (Süden): Strandnähe, Pool, Dünen vor der Tür."}, {"name": "Hotel Cordial Plaza Mayor de Santa Ana", "lat": 28.0993, "lng": -15.4149, "cat": "unterkunft", "desc": "Empfehlung zweite Hälfte: mitten in Vegueta, kurze Wege zu Kathedrale, Strand und Tapas."}, {"name": "Playa de Amadores", "lat": 27.7822, "lng": -15.7253, "cat": "extras", "desc": "Geschützte Bucht mit ruhigem Wasser – idealer Strandtag zu Beginn."}, {"name": "Anfi del Mar", "lat": 27.7836, "lng": -15.6967, "cat": "extras", "desc": "Bucht mit türkisem, ruhigem Wasser. Strandtag."}, {"name": "Roque Bentayga", "lat": 27.9772, "lng": -15.6378, "cat": "extras", "desc": "Heiliger Felsen der Ureinwohner. Schöne Wanderung als zweiter Bergtag."}, {"name": "Artenara", "lat": 28.0214, "lng": -15.6494, "cat": "extras", "desc": "Höchstgelegenes Dorf der Insel mit Höhlenhäusern, umgeben von Pinienwäldern."}, {"name": "Barranco de Guayadeque", "lat": 27.9081, "lng": -15.4661, "cat": "extras", "desc": "Schlucht mit bewohnten Höhlen und Restaurants direkt im Fels."}, {"name": "Agüimes", "lat": 27.9061, "lng": -15.4467, "cat": "extras", "desc": "Hübsche, gepflegte Altstadt im Osten – gut kombinierbar mit Guayadeque."}, {"name": "Santa María de Guía", "lat": 28.1408, "lng": -15.6314, "cat": "kulinarik", "desc": "Heimat des Queso de Flor – Käse, gelabt mit den Blüten der wilden Distel."}];

  const map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap-Mitwirkende'
  }).addTo(map);

  const groups = {};
  Object.keys(CATEGORIES).forEach(k => { groups[k] = L.layerGroup().addTo(map); });

  const bounds = [];
  PLACES.forEach(p => {
    const cat = CATEGORIES[p.cat];
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: 8, color: '#333', weight: 1, fillColor: cat.color, fillOpacity: 0.95
    });
    marker.bindPopup(
      '<b>' + p.name + '</b><br/>' +
      '<span class="cat" style="background:' + cat.color + '">' + cat.label + ' · ' + cat.tag + '</span><br/>' +
      p.desc
    );
    marker.bindTooltip(p.name, {direction:'top', offset:[0,-6]});
    marker.addTo(groups[p.cat]);
    bounds.push([p.lat, p.lng]);
  });
  map.fitBounds(bounds, {padding:[30,30]});

  // Ebenen-Umschalter (Etappen ein-/ausblenden)
  const overlays = {};
  Object.keys(CATEGORIES).forEach(k => {
    const c = CATEGORIES[k];
    overlays['<span class="dot" style="background:' + c.color + '"></span>' + c.label] = groups[k];
  });
  L.control.layers(null, overlays, {collapsed:false}).addTo(map);

  // Legende
  const legend = L.control({position:'bottomleft'});
  legend.onAdd = function(){
    const div = L.DomUtil.create('div','legend');
    let html = '<b>Gran Canaria Rundreise</b>';
    Object.keys(CATEGORIES).forEach(k => {
      const c = CATEGORIES[k];
      html += '<div><span class="dot" style="background:' + c.color + '"></span>' + c.label + '</div>';
    });
    div.innerHTML = html;
    return div;
  };
  legend.addTo(map);
</script>
</body>
</html>
